services:
  prereq:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      PREREQ_HOSTS: "${PREREQ_HOSTS:-localhost,127.0.0.1}"
      PREREQ_PUBLIC_SCHEME: "${PREREQ_PUBLIC_SCHEME:-}"
      PREREQ_OFFLINE: "${PREREQ_OFFLINE:-0}"
    volumes:
      - catalog-cache:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  catalog-cache:
