name: Check PREREQ release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bundled release
        run: python3 scripts/ci_release_check.py

      - name: Check JavaScript
        run: |
          node --check web/app.js
          node --check web/model.js
          node --test tests/model.test.cjs

      - name: Verify generated preview
        run: |
          python3 scripts/build_preview.py
          git diff --exit-code -- preview.html docs/index.html
