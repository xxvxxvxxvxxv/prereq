# Free TEST deployment. Sleeps when idle; its SQLite cache is not persistent.
# For a durable public service, see docs/PUBLISHING.md, section 4.
services:
  - type: web
    name: prereq
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements-production.txt
    startCommand: gunicorn --config gunicorn.conf.py prereq.app:application
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PREREQ_CACHE
        value: /tmp/prereq/catalog.sqlite3
      - key: PREREQ_PUBLIC_SCHEME
        value: https
      - key: PREREQ_OFFLINE
        value: "0"
